syntax = "proto3";

package poolmgr.v1alpha1;

import "google/protobuf/empty.proto";
import "poolmgr/v1alpha1/types.proto";

option go_package = "github.com/liquidmetal-dev/battery/api/proto/poolmgr/v1alpha1;poolmgrv1alpha1";

// HostAdmin manages the registry of flintlock hosts and their cordon state. Cordoning a
// host stops the reconciler from placing new VMs there; existing VMs are unaffected and
// wind down through normal lease expiry or release.
service HostAdmin {
  rpc CordonHost(CordonHostRequest) returns (Host);
  // UncordonHost clears a host's cordon and ends any drain, resuming placement.
  rpc UncordonHost(UncordonHostRequest) returns (Host);
  // DrainHost cordons a host and marks it draining. The manager then deletes every VM on
  // the host that is not leased: available, provisioning, quarantined and failed. It keeps
  // doing so while the host is draining, so a VM that becomes unleased later goes too.
  // Leased VMs end through release or expiry, and vm_count reaches 0 once the last one
  // has ended. DrainHost is idempotent, and UncordonHost ends the drain. It fails with
  // NOT_FOUND for an unknown host.
  rpc DrainHost(DrainHostRequest) returns (Host);
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);

  // AddHost registers a new host. Unless skip_validation is set, the manager first dials
  // it and checks its flintlock version, and stores nothing if either fails.
  rpc AddHost(AddHostRequest) returns (Host);
  // UpdateHost replaces an existing host's address and TLS settings and redials it.
  rpc UpdateHost(UpdateHostRequest) returns (Host);
  // RemoveHost unregisters a host. It fails while any pool spec names the host in
  // flintlock_hosts, or while any VM or in-flight placement is still counted against it.
  rpc RemoveHost(RemoveHostRequest) returns (google.protobuf.Empty);
  rpc GetHost(GetHostRequest) returns (HostStatus);
}

message CordonHostRequest {
  string name = 1;

  // Reason is an optional free-text note recorded alongside the cordon.
  string reason = 2;
}

message UncordonHostRequest {
  string name = 1;
}

message DrainHostRequest {
  string name = 1;

  // Reason is an optional free-text note. When set, it replaces the host's
  // cordoned_reason. When empty, the host keeps its current reason.
  string reason = 2;
}

message ListHostsRequest {}

message AddHostRequest {
  // Name, address, and tls are read. Cordon and drain fields and timestamps
  // are ignored: a new host starts uncordoned and not draining.
  Host host = 1;

  // SkipValidation adds the host without dialing it. Use it to register a
  // host before it is reachable.
  bool skip_validation = 2;
}

message UpdateHostRequest {
  // Host is matched by host.name and carries the new address and tls. Cordon
  // and drain fields are ignored; CordonHost, UncordonHost and DrainHost own them.
  Host host = 1;

  // SkipValidation updates the host without dialing it.
  bool skip_validation = 2;
}

message RemoveHostRequest {
  string name = 1;
}

message GetHostRequest {
  string name = 1;
}

// HostStatus pairs a host's registry record with everything still counted against it.
message HostStatus {
  Host host = 1;

  // VmCount is the number of VM records placed on this host in any phase (including
  // DELETING, QUARANTINED and FAILED, all of which may still exist on the host) plus
  // in-flight placements that have been reserved but not yet recorded, across all pools.
  // Maintenance is safe once the host is cordoned and this reaches 0: nothing remains on
  // it and nothing more can be placed there.
  int32 vm_count = 2;

  // FlintlockVersion is the version the last successful ServerInfo call
  // reported. Empty until the manager has checked the host.
  string flintlock_version = 3;
}

message ListHostsResponse {
  repeated HostStatus hosts = 1;
}
