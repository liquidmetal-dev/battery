apiVersion: v1
kind: Service
metadata:
  name: {{ include "poolmgrd.fullname" . }}
  labels:
    {{- include "poolmgrd.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "poolmgrd.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ include "poolmgrd.portFromAddr" .Values.config.api_server.addr }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ include "poolmgrd.portFromAddr" .Values.config.metrics_addr }}
      targetPort: metrics
      protocol: TCP
